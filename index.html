<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סורק מחלקות</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--ac:#1d4ed8;--acx:#fff;--bd:#e2e5ea;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a2029;--tx:#eef1f5;--mut:#9aa3b2;--ac:#60a5fa;--acx:#0b1220;--bd:#2b3340;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;max-width:560px;margin-inline:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.depts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dept{padding:14px 6px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px;font-weight:600}
.dept.on{border-color:var(--ac);background:var(--ac);color:var(--acx)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:17px;font-weight:700;display:block;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45}
#reader{width:100%;border-radius:12px;overflow:hidden;margin-top:10px}
.row{display:flex;gap:8px;margin-top:10px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
#msg{min-height:24px;margin-top:8px;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:start;word-break:break-all}
</style>
</head>
<body>
<h1>סריקה לפי מחלקה</h1>

<div class="card">
  <div class="mut" style="margin-bottom:8px">בחרו מחלקה (נשמר במכשיר)</div>
  <div class="depts" id="depts"></div>
</div>

<div class="card">
  <button class="btn" id="camBtn" disabled>📷 הפעל מצלמה</button>
  <div id="reader"></div>
  <div class="row">
    <input id="manual" placeholder="או הקלדה / סורק חיצוני" autocomplete="off">
    <button class="btn" id="addBtn" style="width:auto;padding:12px 18px" disabled>הוסף</button>
  </div>
  <div id="msg"></div>
  <div class="mut" id="status"></div>
</div>

<div class="card" id="sheetCard" hidden>
  <a class="btn" id="sheetLink" target="_blank" rel="noopener">📊 פתח את הגיליון (Excel / Sheets)</a>
</div>

<div class="card">
  <div style="font-weight:700;margin-bottom:8px">נשלח מהמכשיר הזה</div>
  <table><thead><tr><th>זמן</th><th>מחלקה</th><th>קוד</th></tr></thead><tbody id="log"></tbody></table>
</div>

<script>
// ===== הגדרות: להדביק כאן את הכתובות =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCBdLHF4XaFEe-5oeWZAg7QHnTgoR1xeCFdgZ-TNe7yNLct_z-naorlk793AS_mfwMyQ/exec";   // כתובת ה-Web app של Apps Script (נגמרת ב- /exec)
const SHEET_URL  = "https://docs.google.com/spreadsheets/d/1-iSjcV1Kr7vyrpc10hwONfNJjWD6aj3wJix7vvuGb0Q/edit";                          // אופציונלי: קישור לגיליון, להצגת כפתור "פתח גיליון"
// =========================================

const DEPTS=["דלק","גיל קאר","הכנה","טסט","שטיפה","שומרים יציאה"];
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let dept=ls.get("dept"); if(!DEPTS.includes(dept)) dept=null;
let queue=[],recent=[],scanner=null,running=false,lastCode="",lastAt=0,sending=false;
try{queue=JSON.parse(ls.get("queue")||"[]")}catch(e){}
try{recent=JSON.parse(ls.get("recent")||"[]")}catch(e){}

function say(t,c){const m=$("msg");m.textContent=t;m.className=c||""}
function fmt(ts){return new Date(ts).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"medium"})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function render(){
  const box=$("depts");box.innerHTML="";
  DEPTS.forEach(d=>{const b=document.createElement("button");b.className="dept"+(d===dept?" on":"");b.textContent=d;
    b.onclick=()=>{dept=d;ls.set("dept",d);render()};box.appendChild(b)});
  $("camBtn").disabled=!dept;$("addBtn").disabled=!dept;
  $("status").textContent=SCRIPT_URL.startsWith("http")?(queue.length?`${queue.length} סריקות ממתינות לשליחה (אין חיבור)`:"מחובר לגיליון"):"חסרה כתובת SCRIPT_URL בקובץ";
  const tb=$("log");tb.innerHTML="";
  recent.slice(0,15).forEach(s=>{const tr=document.createElement("tr");
    [fmt(s.ts),s.dept,s.code].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});
  if(SHEET_URL){$("sheetCard").hidden=false;$("sheetLink").href=SHEET_URL}
}

async function flush(){
  if(sending||!queue.length||!SCRIPT_URL.startsWith("http"))return;
  sending=true;
  while(queue.length){
    try{
      // no-cors: לא קוראים תשובה; ה-id מונע שורה כפולה אם נשלח שוב
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(queue[0])});
      queue.shift();ls.set("queue",JSON.stringify(queue));
    }catch(e){break}
  }
  sending=false;render();
}

function onCode(code,format){
  code=String(code||"").trim();if(!code||!dept)return;
  const now=Date.now();
  if(code===lastCode&&now-lastAt<1500)return; // רק נגד קריאה כפולה של אותו פריים
  lastCode=code;lastAt=now;
  const rec={id:uid(),ts:now,dept,code,format:format||"ידני"};
  queue.push(rec);ls.set("queue",JSON.stringify(queue));
  recent.unshift(rec);recent=recent.slice(0,30);ls.set("recent",JSON.stringify(recent));
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  say("✔ נסרק: "+code+" ("+dept+")","ok");
  render();flush();
}

$("camBtn").onclick=async()=>{
  if(running){await scanner.stop();running=false;$("camBtn").textContent="📷 הפעל מצלמה";return}
  try{
    scanner=scanner||new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:160}},
      (t,r)=>onCode(t,r&&r.result&&r.result.format&&r.result.format.formatName),()=>{});
    running=true;$("camBtn").textContent="⏹ עצור מצלמה";say("");
  }catch(e){say("אין גישה למצלמה – אשרו הרשאה, או השתמשו בהקלדה","bad")}
};
$("addBtn").onclick=()=>{const v=$("manual").value;$("manual").value="";onCode(v,"ידני")};
$("manual").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});
addEventListener("online",flush);setInterval(flush,30000);
render();flush();
</script>
</body>
</html>
